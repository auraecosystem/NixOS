name: NixOS configuration CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Format and evaluate Nix configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix run .#formatter.x86_64-linux -- --check flake.nix Modules/core/default.nix Modules/default.nix tests/evaluation/default.nix

      - name: Evaluate flake and run checks
        run: nix flake check --show-trace

name: Nix configuration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Evaluate flake and run checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format and show canonical diff
        run: |
          nix run .#formatter.x86_64-linux -- flake.nix modules/base.nix tests/module-evaluation.nix
          git diff -- flake.nix modules/base.nix tests/module-evaluation.nix

      - name: Evaluate flake and run checks
        run: nix flake check --show-trace
